function newQ(){if(D.length<4){qz=null;return}const p=pick(D,1)[0];qz={p,o:pick([p,...pick(D.filter(x=>x.id!==p.id),3)],4),a:null}}

const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!?¡¿;:'"’-]/g,'').replace(/\s+/g,' ').trim();

function newM(){const d=pick(list().length>=3?list():D,6);mg=d.length>=2?{L:pick(d,6).map(x=>x.id),R:pick(d,6).map(x=>x.id),done:[],sel:null,bad:null}:null}
function mc(side,id){if(mg.done.includes(id))return;if(!mg.sel||mg.sel.side===side){mg.sel={side,id}}else{if(mg.sel.id===id){mg.done.push(id);S.xp+=5;S.streak++;if(mg.done.length===mg.L.length)S.xp+=20}else{S.streak=0;mg.bad=[mg.sel,{side,id}];setTimeout(()=>{if(mg){mg.bad=null;draw()}},600)}mg.sel=null}sv();draw()}
function vMatch(){if(!mg)newM();if(!mg)return `<div class="e">${t('empty')}</div>`;
const cell=(side,id)=>{const p=D.find(x=>x.id===id);const dn=mg.done.includes(id),sl=mg.sel&&mg.sel.side===side&&mg.sel.id===id,bd=mg.bad&&mg.bad.some(b=>b.side===side&&b.id===id);
return `<button class="opt ${dn?'ok':bd?'bad':sl?'sel':''}" ${dn?'disabled':''} dir="${side==='l'?'ltr':dirOf(S.my)}" onclick="mc('${side}',${id})">${e(p[side==='l'?S.learn:S.my])}</button>`};
const fin=mg.done.length===mg.L.length;
return `<div class="nar"><div class="mg"><div>${mg.L.map(i=>cell('l',i)).join('')}</div><div>${mg.R.map(i=>cell('r',i)).join('')}</div></div>${fin?`<p style="font-weight:700;color:var(--ok);text-align:center">${t('done')}</p><div class="row"><button class="btn" onclick="newM();draw()">${t('next')}</button></div>`:''}</div>`}

function vAdmin(){
if(!admin)return `<div class="card nar"><h3>${t('admin')}</h3><label>${t('pw')}</label><input type="password" id="pw" onkeydown="if(event.key==='Enter')login()"><div class="row"><button class="btn" onclick="login()">${t('login')}</button></div><p style="color:var(--bad)">${msg}</p></div>`;
const p=ed!=null?D.find(x=>x.id===ed):{k:'w',c:Object.keys(CAT())[0],lv:'A1'};const x=p.ex||{};
return `<div class="ad"><div>
<div class="card"><h3>${ed!=null?'✏️ ':''}${t('newp')}</h3>
<label>${t('kind')}</label><select id="f_k" style="width:100%"><option value="w" ${(p.k||'p')==='w'?'selected':''}>${t('words')}</option><option value="p" ${(p.k||'p')==='p'?'selected':''}>${t('sents')}</option></select>
<label>${t('cat')}</label><select id="f_c" style="width:100%">${opts(Object.keys(CAT()),p.c,cn)}</select>
<label>${t('lvl')}</label><select id="f_lv" style="width:100%">${opts(LV,p.lv||'A1',x=>x)}</select>
${LG.map(l=>`<label>${LN[l]}</label><input id="f_${l}" dir="${dirOf(l)}" value="${e(p[l]||'')}">`).join('')}
<label><b>${t('ex')}</b></label>${LG.map(l=>`<input id="x_${l}" dir="${dirOf(l)}" placeholder="${LN[l]}" style="margin-bottom:.3rem" value="${e(x[l]||'')}">`).join('')}
<p style="color:var(--bad);margin:.3rem 0">${msg}</p>
<div class="row" style="margin-top:.3rem"><button class="btn g" onclick="addP()">${t('save')}</button>${ed!=null?`<button class="btn m" onclick="ed=null;draw()">✕</button>`:''}<button class="btn m" onclick="logout()">${t('out')}</button></div></div>
<div class="card"><h3>${t('addcat')}</h3>${['fa','de','en','es'].map(l=>`<input id="cn_${l}" dir="${dirOf(l)}" placeholder="${LN[l]}" style="margin-bottom:.3rem">`).join('')}<div class="row" style="margin-top:.3rem"><button class="btn" onclick="addC()">${t('save')}</button></div></div>
<div class="card"><div class="row" style="margin:0"><button class="btn s" onclick="expD()">${t('exp')}</button><button class="btn m" onclick="document.getElementById('imp').click()">${t('imp')}</button><input type="file" id="imp" accept=".json" hidden onchange="impD(this.files[0])"></div><p style="color:var(--mut)">${t('hint')}</p>
<label>${t('chpw')}</label><input id="np"><div class="row"><button class="btn" onclick="chPw()">${t('save')}</button></div></div></div>
<div>${D.slice().reverse().map(y=>`<div class="p" style="margin-bottom:.6rem"><div class="t"><b dir="ltr">${e(y.de)}<span class="lv">${y.lv||'A1'}</span></b><span dir="ltr">${e(y.en)} · ${e(y.es)}</span><span dir="rtl" style="display:block">${e(y.fa)}</span><span style="font-size:.8rem">${(y.k||'p')==='w'?t('words'):t('sents')} · ${e(cn(y.c))}</span></div><div class="ab"><button onclick="ed=${y.id};msg='';draw();scrollTo(0,0)" aria-label="edit">✏️</button><button onclick="delP(${y.id})" aria-label="${t('del')}">🗑️</button></div></div>`).join('')}</div></div>`}
function login(){const pw=localStorage.getItem('lp_pw')||'admin1234';if(document.getElementById('pw').value===pw){admin=true;msg=''}else msg=t('wrong');draw()}
function logout(){admin=false;ed=null;draw()}
function chPw(){const v=document.getElementById('np').value.trim();if(v.length>=6){try{localStorage.setItem('lp_pw',v)}catch(x){}document.getElementById('np').value=''}}
function addP(){const g=i=>document.getElementById(i).value.trim();const o={k:g('f_k'),c:g('f_c'),lv:g('f_lv')};LG.forEach(l=>o[l]=g('f_'+l));
if(LG.some(l=>!o[l])){msg=t('fill');draw();return}
const ex={};LG.forEach(l=>{if(g('x_'+l))ex[l]=g('x_'+l)});if(Object.keys(ex).length)o.ex=ex;
if(ed!=null){const i=D.findIndex(z=>z.id===ed);D[i]={id:ed,...o}}else D.push({id:Date.now(),...o});ed=null;msg='';svD();draw()}
function addC(){const n={};['fa','de','en','es'].forEach(l=>n[l]=document.getElementById('cn_'+l).value.trim());const f=Object.values(n).find(v=>v);if(!f)return;for(const l in n)n[l]=n[l]||f;CU['c'+Date.now()]=n;svD();draw()}
function delP(id){D=D.filter(x=>x.id!==id);svD();draw()}
function expD(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({items:D,cats:CU},null,1)],{type:'application/json'}));a.download='data.json';a.click()}
function applyData(j){if(Array.isArray(j))D=j;else if(j&&Array.isArray(j.items)){D=j.items;CU=j.cats||{}}else return false;return true}
function impD(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{if(applyData(JSON.parse(r.result))){svD();draw()}}catch(x){}};r.readAsText(f)}

const TABS=['learn','cards','quiz','type','match','saved','admin'],VW={learn:vLearn,cards:vCards,quiz:vQuiz,type:vType,match:vMatch,saved:vSaved,admin:vAdmin};
function draw(keep){
 const el=document.documentElement;el.lang=S.ui;el.dir=dirOf(S.ui);el.dataset.t=S.dark?'dark':'light';
 ui.value=S.ui;sub.textContent=t('sub');setWm();
 sw.innerHTML=['de','en','es'].map(l=>`<button class="${S.learn===l?'on':''}" onclick="S.learn='${l}';qz=ty=mg=null;sv();draw()">${LN[l]}</button>`).join('')+
 `<select onchange="S.my=this.value;sv();draw()" aria-label="${t('my')}">${['fa','de','en','es'].map(l=>`<option value="${l}" ${S.my===l?'selected':''}>${t('my')} ${LN[l]}</option>`).join('')}</select>`;
 st.innerHTML=`<div>${S.xp}<small>${t('xp')}</small></div><div>🔥 ${S.streak}<small>${t('streak')}</small></div><div>${S.known.length}/${D.length}<small>${t('known')}</small></div>`;
 nav.innerHTML=TABS.map(k=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';sv();draw()">${t(k)}</button>`).join('');
 const a=document.activeElement,pos=a&&a.tagName==='INPUT'?a.selectionStart:null,isQ=keep&&a&&a.placeholder;
 app.innerHTML=VW[S.tab]();
 if(isQ){const i=app.querySelector('input');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(x){}}}
}
draw();
fetch('data.json').then(r=>r.ok?r.json():null).then(j=>{if(!ld('lp_data')&&applyData(j))draw()}).catch(()=>{});
</script>
</body>
</html>
