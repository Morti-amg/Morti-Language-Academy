function dmH(){const mine=m=>CH.adm?m.from==='a':m.from==='u';return CH.th.map(m=>`<div class="cm${mine(m)?' me':''}"><span class="av">${m.from==='a'?'👑':e(S.chat.av)}</span><div class="bb"><div class="mt" dir="auto">${e(m.text)}</div><small>${tmf(m.ts)}</small></div></div>`).join('')||`<div class="e">—</div>`}
const admBar=()=>{if(!CH.net)return '';const a=Object.entries(CH.on).find(([k,o])=>o.admv);return a?`<div class="admon on">👑 ${t('admon')} ${CH.uid!==a[0]?`<button class="chip" onclick="openPm('${e(a[0])}')">✉️</button><button class="chip" onclick="startCall('${e(a[0])}',false)">📞</button><button class="chip" onclick="startCall('${e(a[0])}',true)">🎥</button>`:''}</div>`:`<div class="admon">👑 ${t('admoff')}</div>`};
const onlineH=()=>{const a=Object.entries(CH.on).sort((x,y)=>(y[1].admv?1:0)-(x[1].admv?1:0)),dn=CH.net&&!NDB.up;return `<span class="dotg${dn?' off':''}"></span><b>${a.length}</b> ${t('online')}`+a.slice(0,14).map(([k,o])=>k===CH.uid||!CH.net?`<span class="chip">${e(o.av||'🙂')} ${e(o.name||'')}${k===CH.uid?' ·':''}</span>`:`<button class="chip" onclick="openPm('${e(k)}')">${o.admv?'👑':e(o.av||'🙂')} ${e(o.name||'')}</button>`).join('')+`<button class="chip" onclick="S.snd=S.snd===false;sv();drawChat()" aria-label="sound">${S.snd===false?'🔕':'🔔'}</button>`+(dn?`<span class="chip">⏳ ${t('loading')}</span>`:'')};
function inbH(){return Object.entries(CH.idx||{}).sort((a,b)=>b[1].ts-a[1].ts).map(([u,o])=>`<button class="ib2${o.u?' un':''}${CH.dw===u?' on':''}" onclick="openDm('${u}')"><span class="av">${e(o.av||'🙂')}</span><span><b>${e(o.name||u)}</b><small>${e(o.last||(CH.net?'🔒':''))}</small></span></button>`).join('')||`<p class="e">—</p>`}
function modH(){const keys=[...new Set([...Object.keys(CH.on),...Object.keys(CH.mutes||{}).filter(k=>CH.mutes[k])])];
const on=keys.map(k=>{const o=CH.on[k]||{};return `<div class="p"><div class="t"><b>${e(o.av||'🔇')} ${e(o.name||k)}</b>${CH.mutes[k]?'<span> 🔇</span>':''}</div><div class="ab"><button onclick="muteU('${k}')" aria-label="mute">${CH.mutes[k]?'🔊':'🔇'}</button></div></div>`}).join('');
const rp=Object.entries(CH.rep||{}).map(([rid,r])=>`<div class="p"><div class="t"><b>${e(r.name)}</b><span dir="auto">${e(r.text)}</span></div><div class="ab"><button onclick="delM('${r.mid}',1);DB.rm('reports/${rid}')">🗑</button><button onclick="muteU('${r.uid}')">🔇</button><button onclick="DB.rm('reports/${rid}')">✓</button></div></div>`).join('');
return `<h3>🟢 ${t('online')} (${Object.keys(CH.on).length})</h3><div class="grid">${on||'<p class="e">—</p>'}</div><h3>🚩 ${t('reports')} (${Object.keys(CH.rep||{}).length})</h3>${rp||'<p class="e">—</p>'}`}
function drawChat(){updNav();if(S.tab!=='community'||!S.chat.ok)return;if(viewing()&&CH.unr){CH.unr=0;ttl();updNav()}const set=(id,h)=>{const n=$(id);if(n)n.innerHTML=h};
const m=$('cmsgs');if(m&&S.sub==='pub'){const nb=m.scrollHeight-m.scrollTop-m.clientHeight<90;m.innerHTML=msgsH();if(nb)m.scrollTop=m.scrollHeight}
const d=$('cdm');if(d){const nb=d.scrollHeight-d.scrollTop-d.clientHeight<90;d.innerHTML=dmH();if(nb)d.scrollTop=d.scrollHeight}
{const m=$('cpt');if(m){const nb=m.scrollHeight-m.scrollTop-m.clientHeight<90;m.innerHTML=pmH();if(nb)m.scrollTop=m.scrollHeight}}set('cpl',pmListH());set('conl',onlineH());set('cadm',admBar());set('cinb',inbH());set('cmod',modH());drawTyp()}
function selM(id){CH.sel=CH.sel===id?null:id;drawChat()}
async function sendRaw(x){x=x.trim();if(!x||isMuted())return false;
if(!CH.adm&&/https?:|www\./i.test(x)){toast(t('nolink'));return false}
if(Date.now()-CH.last<1200)return false;CH.last=Date.now();
const id=mkId(),o={uid:CH.uid,name:S.chat.name,av:S.chat.av,text:x.slice(0,300),ts:Date.now()};
if(CH.adm){o.adm=true;if(CH.net)o.sig=await CR.sign('msg|'+id+'|'+o.uid+'|'+o.ts+'|'+o.text)}
DB.set('rooms/main/'+id,o);S.cn=(S.cn||0)+1;sv();setTimeout(()=>{const m=$('cmsgs');if(m)m.scrollTop=m.scrollHeight},80);return true}
function sendM(){const i=$('ci');if(!i)return;const x=i.value;i.value='';sendRaw(x).then(ok=>{if(!ok&&!i.value)i.value=x})}
async function sendDm(){const i=$('cdi');if(!i)return;const x=i.value.trim(),u=CH.adm?CH.dw:CH.uid;if(!x||!u)return;
if(CH.net){try{const k=await dmKey(u),c=await CR.enc(k,x.slice(0,500));i.value='';DB.push('dm/'+u,{from:CH.adm?'a':'u',...c,ts:Date.now()});
 DB.upd('dmidx/'+u,CH.adm?{ts:Date.now(),u:false}:{name:S.chat.name,av:S.chat.av,pub:(await CR.uk()).pub,ts:Date.now(),u:true})}catch(x){toast('⚠')}return}
DB.push('dm/'+u,{from:CH.adm?'a':'u',text:x.slice(0,500),ts:Date.now()});
DB.upd('dmidx/'+u,CH.adm?{last:x.slice(0,60),ts:Date.now(),u:false}:{name:S.chat.name,av:S.chat.av,last:x.slice(0,60),ts:Date.now(),u:true});i.value=''}
function openDm(u){CH.dw=u;CH.dmSub&&CH.dmSub();CH.th=[];let c=0;CH.dmSub=DB.on('dm/'+u,v=>{const n=++c;thr(v||{},u).then(a=>{if(n===c){CH.th=a;drawChat()}})});DB.upd('dmidx/'+u,{u:false});draw()}
function repM(id){const m=CH.msgs.find(x=>x.id===id);if(!m)return;DB.push('reports',{mid:id,uid:m.uid,name:m.name,text:m.text,by:CH.uid,ts:Date.now()});CH.sel=null;drawChat();toast(t('thanks'))}
async function fixM(id){const m=CH.msgs.find(x=>x.id===id);if(!m)return;const x=prompt(t('fixp'),m.fix?m.fix.text:m.text);if(x===null)return;const tx=x.trim().slice(0,300),ts=Date.now();
if(CH.net){DB.upd('rooms/main/'+id,{fix:{text:tx,ts,sig:await CR.sign('fix|'+id+'|'+tx)}})}else DB.upd('rooms/main/'+id,{fix:tx?{text:tx,ts}:null})}
async function pinM(id){const m=CH.msgs.find(x=>x.id===id);if(!m)return;const on=!m.pin;
if(CH.net)DB.upd('rooms/main/'+id,{pin:{on,ts:Date.now(),sig:await CR.sign('pin|'+id+'|'+on)}});else DB.upd('rooms/main/'+id,{pin:on?true:null})}
async function delM(id,q){if(!(q||confirm(t('del')+'?')))return;
if(CH.net){DB.upd('rooms/main/'+id,{del:{ts:Date.now(),sig:await CR.sign('del|'+id)}});setTimeout(()=>DB.rm('rooms/main/'+id),400)}else DB.rm('rooms/main/'+id)}
async function muteU(u){const on=!CH.mutes[u];
if(CH.net){const ts=Date.now();DB.set('muted/'+u,{on,ts,sig:await CR.sign('mute|'+u+'|'+on+'|'+ts)});if(!on)delete CH.mutes[u];else CH.mutes[u]=true}else DB.set('muted/'+u,on?true:null);toast(on?'🔇':'🔊')}
const rulesH=()=>`<ol class="rl">${[0,1,2,3,4,5].map(i=>`<li>${t('r'+i)}</li>`).join('')}</ol>`;
function chk(){const b=$('jb');if(b)b.disabled=!(S.chat.name.trim().length>=2&&CH.acc)}
function vJoin(){const c=S.chat;return `<div class="card nar"><h3>💬 ${t('chat_join')}</h3><label>${t('nick')}</label><input id="jn" maxlength="20" value="${e(c.name)}" oninput="S.chat.name=this.value;chk()"><label>${t('avatar')}</label><div class="avg">${AVS.map(a=>`<button class="${c.av===a?'on':''}" onclick="S.chat.av='${a}';draw()">${a}</button>`).join('')}</div><h3 style="margin-top:1rem">🤝 ${t('rtitle')}</h3>${rulesH()}<label class="ck"><input type="checkbox" onchange="CH.acc=this.checked;chk()" ${CH.acc?'checked':''}> ${t('acc')}</label><div class="row"><button class="btn g" id="jb" ${c.name.trim().length>=2&&CH.acc?'':'disabled'} onclick="joinChat()">💬 ${t('enter')}</button></div></div>`}
function vCommunity(){if(!CH.ready)return `<div class="e">${t('loading')}</div>`;if(!S.chat.ok)return vJoin();
const P=(CH.adm?['pub','pm','inbox','mod','rules']:['pub','pm','dm','rules']).filter(k=>k!=='pm'||CH.net),IC={pub:'💬',pm:'👥',dm:'🛡✉️',inbox:'📥',mod:'🛡',rules:'📜'};if(!P.includes(S.sub))S.sub='pub';
const pills=`<div class="pls">${P.map(k=>`<button class="${S.sub===k?'on':''}" onclick="S.sub='${k}';sv();draw()">${IC[k]} ${t(k)}${k==='inbox'&&dmUn()?' ('+dmUn()+')':''}${k==='pm'&&pmUn()?' ('+pmUn()+')':''}</button>`).join('')}</div>`;
const comp=(id,fn,ex)=>`<div class="comp"><input id="${id}" maxlength="500" autocomplete="off" ${ex||''} placeholder="${t('typem')}" onkeydown="if(event.key==='Enter')${fn}()"><button class="btn snd" onclick="${fn}()">${t('send')}</button></div>`;
let b='';
if(S.sub==='pub'){const w=todayWord();b=`<div id="cadm">${admBar()}</div><div class="ons" id="conl">${onlineH()}</div>${w?`<div class="prm">${t('cprompt').replace('{w}',e(w[S.learn]))}</div>`:''}<div class="cmsgs" id="cmsgs">${msgsH()}</div><div class="typ" id="ctyp"></div>${isMuted()?`<p class="e">${t('mutedm')}</p>`:comp('ci','sendM','oninput="typ()"')}`}
else if(S.sub==='pm')b=CH.pw?`<div class="row" style="margin:0 0 .4rem"><button class="btn m" onclick="CH.pw=null;draw()">← ${t('back')}</button><b style="align-self:center;flex:1">${e((CH.on[CH.pw]||CH.pmi[CH.pw]||{}).av||'🙂')} ${e((CH.on[CH.pw]||CH.pmi[CH.pw]||{}).name||'')}</b><button class="btn s" onclick="startCall(CH.pw,false)" aria-label="call">📞</button><button class="btn s" onclick="startCall(CH.pw,true)" aria-label="video">🎥</button></div><div class="cmsgs" id="cpt">${pmH()}</div>${comp('cpi','sendPm')}`:`<div id="cpl">${pmListH()}</div>`;
else if(S.sub==='dm')b=`<p class="hint">${t('dmhint')}</p><div class="cmsgs" id="cdm">${dmH()}</div>${comp('cdi','sendDm')}`;
else if(S.sub==='inbox')b=`<div class="inb" id="cinb">${inbH()}</div>${CH.dw?`<div class="cmsgs" id="cdm">${dmH()}</div>${comp('cdi','sendDm')}`:''}`;
else if(S.sub==='mod')b=`<div id="cmod">${modH()}</div>`;
else b=`<div class="card"><h3>🤝 ${t('rtitle')}</h3>${rulesH()}</div>`;
return (CH.live||CH.net?'':`<div class="card dm0">${t('demo')}</div>`)+pills+b}

const TABS=['learn','practice','journey','community'],VW={learn:vLearn,practice:vPractice,journey:vJourney,community:vCommunity,admin:vAdmin};
function draw(keep){
 if(!VW[S.tab])S.tab='learn';if(!(S.tab==='practice'&&S.pm==='blitz')){clearInterval(bzT);bz=null}
 const el=document.documentElement;el.lang=S.ui;el.dir=dirOf(S.ui);el.dataset.t=S.dark?'dark':'light';
 ui.value=S.ui;sub.textContent=t('sub');setWm();
 sw.innerHTML=['de','en','es'].map(l=>`<button class="${S.learn===l?'on':''}" onclick="S.learn='${l}';qz=ty=mg=null;sv();draw()">${LN[l]}</button>`).join('')+
 `<select onchange="S.my=this.value;sv();draw()" aria-label="${t('my')}">${['fa','de','en','es'].map(l=>`<option value="${l}" ${S.my===l?'selected':''}>${t('my')} ${LN[l]}</option>`).join('')}</select>`;
 st.innerHTML=`<div>${S.xp}<small>${t('xp')}</small></div><div>🔥 ${S.streak}<small>${t('streak')}</small></div><div>${S.known.length}/${D.length}<small>${t('known')}</small></div>`;
 nav.innerHTML=TABS.map(k=>`<button id="nv_${k}" class="${S.tab===k?'on':''}" onclick="S.tab='${k}';${k==='practice'?'S.pm=null;':''}sv();draw()">${navLabel(k)}</button>`).join('');
 const a=document.activeElement,pos=a&&a.tagName==='INPUT'?a.selectionStart:null,isQ=keep&&a&&a.placeholder;
 app.innerHTML=VW[S.tab]();const cm=document.getElementById('cmsgs');if(cm)cm.scrollTop=cm.scrollHeight;
 if(isQ){const i=app.querySelector('input');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(x){}}}
}
draw();startChat();
fetch('data.json').then(r=>r.ok?r.json():null).then(j=>{if(!ld('lp_data')&&applyData(j))draw()}).catch(()=>{});
